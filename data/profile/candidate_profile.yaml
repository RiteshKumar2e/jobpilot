# ---------------------------------------------------------------------------
# Standing answers for application forms. `match` is a regex tested against
# the question's label (case-insensitive); the first match wins. The browser
# agent ONLY fills what is listed here or in `candidate` above — a REQUIRED
# question with no answer stops that application at ACTION_REQUIRED and you
# get an email with the link. Every answer here must be true.
# ---------------------------------------------------------------------------
application_answers:
  - {match: "current (ctc|salary|compensation)", answer: "0 (Fresher)"}
  - {match: "current (company|employer|organi[sz]ation)|^org$", answer: "Arka Jain University"}
  - {match: "^degree", answer: "Bachelor"}
  - {match: "^discipline|field of study|major", answer: "Computer Science"}
  - {match: "graduation (year|date)|year of graduation", answer: "2026"}
  - {match: "years of (professional |relevant |work )?experience", answer: "0"}
  - {match: "expected (ctc|salary|compensation)|salary expectation", answer: "10-30 LPA (negotiable)"}
  - {match: "how did you (hear|learn|find|come)", answer: "Company website"}
  # Confirmed by you (2026-10-27):
  - {match: "sponsor", answer: "No"}
  - {match: "authori[sz](ed|ation) to work|(legal|legally) (right|eligible|permitted)|right to work|work permit", answer: "Yes"}
  - {match: "notice period|when can you (start|join)|earliest (start|joining)", answer: "Immediate"}
  - {match: "relocat|work from (the )?office|in[- ]office|on[- ]?site|days? (a week )?(in|from) (the )?office|commut", answer: "Yes"}
  # Not confirmed yet — uncomment only if true:
  # - {match: "(currently|previously) (work|been employed)|worked for .* before", answer: "No"}

# Tick required "I acknowledge / I have read the privacy notice / I consent"
# boxes (only required ones — never marketing opt-ins).
auto_acknowledge_privacy: true

locations:
  preferred: ["India (onsite/hybrid)", "Remote (anywhere)"]
  # Onsite/hybrid jobs must be located in India (always enforced).
  # Remote jobs from any country are accepted unless the listing explicitly
  # excludes India (see exclude_india_signals below).
  accept_remote_anywhere: true
  relocate: true

compensation:
  currency: "INR"
  target_min_lpa: 10
  target_max_lpa: 30
  reject_if_salary_undisclosed: false   # per brief: don't reject solely on missing salary

# ---------------------------------------------------------------------------
# Hard exclusions (eligibility killers — applied SEPARATELY from match score)
# ---------------------------------------------------------------------------
exclude:
  internship_only: true
  senior_roles: true
  requires_more_experience: true
  unpaid: true
  excludes_india: true
  # Regex-ish signal phrases used by the verification agent (lowercased):
  senior_signals: ["senior", "sr.", "staff", "principal", "lead ", "manager",
                   "head of", "director", "architect", "10+ years", "8+ years",
                   "7+ years", "6+ years", "5+ years"]
  internship_signals: ["internship", "intern ", "summer intern", "co-op"]
  exclude_india_signals: ["not open to india", "india not eligible",
                          "us citizens only", "must be located in the us",
                          "eu residents only", "uk residents only",
                          "no india", "excluding india"]

